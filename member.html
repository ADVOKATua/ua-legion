<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Кабінет учасника — UA LEGION</title>
  <link rel="stylesheet" href="style.css">
  <style>
    .member-page{min-height:calc(100vh - 76px);padding:50px 20px;display:flex;justify-content:center;box-sizing:border-box}
    .member-container{width:100%;max-width:900px}
    .member-header{margin-bottom:25px}.member-header h1{margin:0 0 8px}.member-header p{margin:0;opacity:.65}
    .member-card,.directions-card{background:linear-gradient(135deg,rgba(255,255,255,.055),rgba(255,255,255,.018));border:1px solid rgba(255,255,255,.12);border-radius:18px;padding:25px;margin-bottom:20px;box-sizing:border-box}
    .member-main{display:flex;align-items:center;gap:20px}.member-avatar{width:100px;height:100px;border-radius:50%;object-fit:cover;background:#171a20;border:3px solid rgba(255,255,255,.12);flex-shrink:0}.member-avatar.avatar-empty{opacity:.25}.member-main h2{margin:0 0 7px}.member-nickname{opacity:.65}
    .global-summary{margin-top:25px;padding-top:20px;border-top:1px solid rgba(255,255,255,.1)}.global-summary h3{margin:0 0 12px}.role-badges,.member-roles,.member-current-roles{display:flex;flex-wrap:wrap;gap:8px}.role-badge{display:inline-flex;padding:8px 11px;border-radius:9px;background:rgba(255,211,77,.08);border:1px solid rgba(255,211,77,.25);font-size:13px;font-weight:700}.empty-role{opacity:.6}
    .directions-card h2{margin:0 0 6px}.directions-description{margin:0 0 20px;opacity:.6}.directions-list{display:flex;flex-direction:column;gap:14px}
    .member-direction-card{border:1px solid rgba(255,255,255,.1);border-radius:14px;padding:18px;background:rgba(255,255,255,.025);box-sizing:border-box}.member-direction-header{display:flex;justify-content:space-between;align-items:center;gap:15px}.member-direction-title{font-size:18px;font-weight:800}.member-direction-status{font-size:12px;padding:5px 9px;border-radius:8px;color:#7df0ad;background:rgba(125,240,173,.08);white-space:nowrap}.member-direction-body{margin-top:15px}.member-info-section{margin-top:14px}.member-info-section:first-child{margin-top:0}.member-info-title{font-size:13px;opacity:.55;margin-bottom:7px;font-weight:700}.member-info-row{display:flex;justify-content:space-between;gap:15px;padding:10px 12px;border-radius:9px;background:rgba(255,211,77,.045);border:1px solid rgba(255,211,77,.12);margin-top:8px}.member-info-label{font-size:12px;opacity:.55}.member-info-value{font-size:14px;font-weight:700}
    .member-game-data{display:flex;flex-direction:column;gap:7px}.member-game-row{display:grid;grid-template-columns:minmax(125px,190px) 1fr;gap:12px;align-items:baseline;padding:9px 10px;border-bottom:1px solid rgba(255,255,255,.055)}.member-game-row:last-child{border-bottom:0}.member-game-label{font-size:12px;font-weight:700;color:rgba(255,255,255,.52)}.member-game-value{min-width:0;font-size:14px;font-weight:600;color:rgba(255,255,255,.92);overflow-wrap:anywhere}.member-game-empty{padding:10px 0;opacity:.55}
    .member-direction-management{margin-top:18px;padding-top:18px;border-top:1px solid rgba(255,255,255,.08)}.member-management-box{padding:15px;border-radius:12px;background:rgba(255,255,255,.035);border:1px solid rgba(255,255,255,.09)}.member-management-title,.member-management-subtitle{font-size:14px;font-weight:800;margin-bottom:11px}.member-management-row{display:flex;align-items:center;gap:9px;margin-top:10px}.member-management-row label{font-size:13px;opacity:.65;min-width:110px}.ets2-driver-class-select,.direction-role-select{flex:1;min-width:0;padding:10px 12px;border-radius:9px;border:1px solid rgba(255,255,255,.14);background:#11151d;color:#fff}.direction-role-select{width:100%}
    .member-management-box button,.member-assign-role button,.btn-remove-role{padding:10px 14px;border-radius:9px;border:1px solid rgba(255,255,255,.13);background:rgba(255,255,255,.055);color:#fff;cursor:pointer;font-weight:700}.btn-save-ets2-class,.btn-assign-role{background:#ffd34d!important;color:#111!important;border-color:#ffd34d!important}.btn-remove-direction,.btn-remove-role{border-color:rgba(255,100,100,.35)!important;color:#ff9b9b!important}.member-management-box button:hover,.member-assign-role button:hover,.btn-remove-role:hover{background:rgba(255,255,255,.1)}
    .member-role-management-wrapper{margin-top:14px}.member-role-management{padding-top:14px;border-top:1px solid rgba(255,255,255,.07)}.member-current-roles{flex-direction:column;gap:7px}.member-current-role{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:9px 11px;border-radius:9px;background:rgba(255,255,255,.035);border:1px solid rgba(255,255,255,.07);font-size:13px}.member-assign-role{display:flex;gap:9px;margin-top:10px}.member-assign-role .direction-role-select{flex:1}
    .management-locked{padding:15px;border-radius:10px;background:rgba(255,255,255,.035);opacity:.7}.member-message{margin-top:15px;min-height:20px}.member-message.error{color:#ff8d8d}.back-link{display:inline-flex;margin-top:10px;padding:11px 17px;border-radius:10px;background:rgba(255,255,255,.06);color:#fff;text-decoration:none}.back-link:hover{background:rgba(255,255,255,.1)}
    @media(max-width:600px){.member-page{padding:30px 12px}.member-card,.directions-card{padding:18px;border-radius:15px}.member-main{align-items:flex-start;flex-direction:column}.member-avatar{width:85px;height:85px}.member-direction-header{align-items:flex-start;flex-direction:column}.member-game-row{grid-template-columns:1fr;gap:3px}.member-management-row,.member-assign-role{flex-direction:column;align-items:stretch}.member-management-row label{min-width:0}.member-management-box button,.member-assign-role button,.member-assign-role select,.ets2-driver-class-select{width:100%;box-sizing:border-box}}


    /* =====================================================
       INLINE DROPDOWNS — UA LEGION
       Меню відкривається всередині потоку документа,
       тому не перекриває сусідні блоки.
       ===================================================== */

    .member-management-row-stack {
      align-items: stretch;
      flex-wrap: wrap;
    }

    .member-management-field {
      flex: 1 1 320px;
      min-width: 0;
    }

    .member-management-field > label {
      display: block;
      margin-bottom: 7px;
      font-size: 12px;
      font-weight: 700;
      color: rgba(255,255,255,.58);
    }

    .member-inline-dropdown {
      width: 100%;
      position: relative;
      box-sizing: border-box;
    }

    .member-inline-dropdown > summary {
      list-style: none;
    }

    .member-inline-dropdown > summary::-webkit-details-marker {
      display: none;
    }

    .member-inline-dropdown-trigger {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      width: 100%;
      min-height: 42px;
      padding: 10px 12px;
      box-sizing: border-box;
      border: 1px solid rgba(255,255,255,.14);
      border-radius: 9px;
      background: #11151d;
      color: #fff;
      cursor: pointer;
      font-size: 13px;
      font-weight: 700;
      transition: border-color .15s ease, background .15s ease;
    }

    .member-inline-dropdown-trigger:hover,
    .member-inline-dropdown[open] > .member-inline-dropdown-trigger {
      border-color: rgba(255,211,77,.45);
      background: #151a23;
    }

    .member-inline-dropdown-arrow {
      flex-shrink: 0;
      opacity: .65;
      transition: transform .15s ease;
    }

    .member-inline-dropdown[open] .member-inline-dropdown-arrow {
      transform: rotate(180deg);
    }

    .member-inline-dropdown-menu {
      display: flex;
      flex-direction: column;
      gap: 5px;
      margin-top: 7px;
      padding: 7px;
      max-height: 240px;
      overflow-y: auto;
      box-sizing: border-box;
      border: 1px solid rgba(255,255,255,.12);
      border-radius: 10px;
      background: #0f131a;
      box-shadow: 0 10px 28px rgba(0,0,0,.28);
    }

    .member-inline-option {
      width: 100%;
      padding: 10px 11px;
      border: 1px solid transparent;
      border-radius: 7px;
      background: transparent;
      color: rgba(255,255,255,.88);
      text-align: left;
      cursor: pointer;
      font-size: 13px;
      font-weight: 600;
    }

    .member-inline-option:hover,
    .member-inline-option:focus-visible {
      background: rgba(255,211,77,.10);
      border-color: rgba(255,211,77,.18);
      outline: none;
    }

    .member-inline-option.is-selected {
      background: rgba(255,211,77,.13);
      color: #ffd34d;
    }

    .member-action-primary,
    .member-action-danger {
      flex-shrink: 0;
    }

    .member-management-row-actions {
      justify-content: flex-start;
    }

    .member-role-management {
      margin-top: 2px;
    }

    .member-role-dropdown {
      flex: 1 1 320px;
      min-width: 0;
    }

    .member-current-role-name {
      min-width: 0;
      overflow-wrap: anywhere;
    }

    @media (max-width: 600px) {
      .member-management-row-stack {
        flex-direction: column;
      }

      .member-management-row-stack .member-action-primary,
      .member-management-row-actions .member-action-danger {
        width: 100%;
      }

      .member-assign-role {
        align-items: stretch;
      }

      .member-role-dropdown {
        width: 100%;
      }

      .member-assign-role .member-action-primary {
        width: 100%;
      }
    }

  </style>
</head>
<body>
  <header class="header"><div class="header-container">
    <a href="index.html" class="logo">UA LEGION</a>
    <nav class="nav" id="mainNavigation">
      <a href="index.html">Головна</a>
      <a href="profile.html">Мій кабінет</a>
      <a href="members.html">👥 Учасники</a>
    </nav>
  </div></header>

  <main class="member-page">
    <div class="member-container">
      <div class="member-header">
        <h1>👤 Кабінет учасника</h1>
        <p>Перегляд учасника та керування його напрямками за наявності відповідних повноважень.</p>
        <a class="back-link" href="members.html">← Повернутися до учасників</a>
      </div>

      <section class="member-card">
        <div class="member-main">
          <img id="memberAvatar" class="member-avatar" alt="Учасник">
          <div><h2 id="memberName">Завантаження...</h2><div id="memberNickname" class="member-nickname"></div></div>
        </div>
        <div class="global-summary"><h3>🌐 GLOBAL</h3><div id="memberGlobalRoles" class="role-badges"></div></div>
      </section>

      <section class="directions-card">
        <h2>🎮 Напрямки</h2>
        <p class="directions-description">Участь у ігрових напрямках та керування посадами.</p>
        <div id="directionsList" class="directions-list"><div class="management-locked">⏳ Завантаження напрямків...</div></div>
      </section>

      <div id="memberError" class="member-message error"></div>
    </div>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="supabase.js"></script>
  <script src="member.js?v=20261002-7"></script>
</body>
</html>
